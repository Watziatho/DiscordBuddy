[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discordbuddy"
version = "0.1.0"
description = "A 100% local, free, desktop AI companion for Windows that behaves like a friend in a Discord voice call."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "DiscordBuddy Team" }
]
keywords = ["ai", "discord", "companion", "local-ai", "llm", "vlm", "tts", "stt", "dxcam"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.27.0",
    "sounddevice>=0.4.6",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "loguru>=0.7.2",
    "PySide6>=6.7.0",
    "opencv-python>=4.9.0",
    "dxcam>=0.0.5; platform_system=='Windows'",
    "llama-cpp-python>=0.2.75",
    "faster-whisper>=1.0.0",
    "piper-tts>=1.2.0",
    "aiosqlite>=0.20.0",
    "numpy>=1.26.0",
    "pillow>=10.3.0",
    "pyyaml>=6.0.1",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
]

[project.scripts]
discordbuddy = "discordbuddy.main:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "ASYNC"]
ignore = []
